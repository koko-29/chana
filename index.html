<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chana Express</title>

<style>
body{
font-family: Arial, sans-serif;
margin:0;
background: linear-gradient(135deg,#f8b500,#fceabb);
}

.container{
max-width:400px;
margin:50px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
text-align:center;
}

h1{
color:#333;
}

.price{
font-size:22px;
color:green;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:12px;
background:#25D366;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1da851;
}

footer{
margin-top:20px;
font-size:12px;
color:gray;
}
</style>
</head>

<body>

<div class="container">

<h1>🥜 Chana Express</h1>
<p class="price">Small Packet – ₹10</p>

<input type="text" id="name" placeholder="Enter Your Name" required>

<input type="text" id="department" placeholder="Enter College Department" required>

<input type="text" id="classroom" placeholder="Enter Classroom / Hall Number" required>

<input type="text" id="semester" placeholder="Enter Semester" required>

<input type="number" id="quantity" placeholder="Enter Quantity" min="1" required>

<button onclick="sendOrder()">Order on WhatsApp</button>

<footer>Fresh & Tasty Chana 😋</footer>

</div>

<script>

function sendOrder(){

let name=document.getElementById("name").value;
let dept=document.getElementById("department").value;
let classroom=document.getElementById("classroom").value;
let semester=document.getElementById("semester").value;
let qty=document.getElementById("quantity").value;

if(name=="" || dept=="" || classroom=="" || semester=="" || qty==""){
alert("Please fill all details");
return;
}

let total=qty*10;

/* 🔥 INSERT OWNER WHATSAPP NUMBER HERE */
let phone="917896975241"; 

let message=`New Chana Order 🥜
Name: ${name}
Department: ${dept}
Classroom: ${classroom}
Semester: ${semester}
Quantity: ${qty}
Total Price: ₹${total}`;
let whatsappURL=`https://web.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`;

window.open(whatsappURL,"_blank");



}



</script>


</body>
</html>
