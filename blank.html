<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alony Blanket Wash</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:'Poppins',sans-serif;
background:#1b3a4b;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
}

.container{
width:100%;
max-width:480px;
padding:20px;
}

.brand{
text-align:center;
margin-bottom:20px;
}

.brand h1{
margin:0;
font-size:28px;
font-weight:600;
}

.brand p{
margin-top:5px;
font-size:14px;
opacity:0.8;
}

.badges{
margin-top:6px;
font-size:12px;
opacity:0.8;
}

.card{
background:#243f52;
padding:22px;
border-radius:14px;
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

label{
display:block;
margin-top:12px;
font-size:13px;
}

input{
width:100%;
padding:12px;
margin-top:5px;
border-radius:8px;
border:none;
font-size:14px;
}

.qtyGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:8px;
}

.qtyBox{
background:#2d4b60;
padding:10px;
border-radius:10px;
}

.priceBox{
margin-top:18px;
padding:15px;
border-radius:10px;
background:#2d4b60;
text-align:center;
}

.totalMoney{
font-size:24px;
font-weight:600;
color:#ffd166;
margin-top:5px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:#25d366;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.footer{
text-align:center;
margin-top:15px;
font-size:12px;
opacity:0.7;
}

</style>
</head>

<body>

<div class="container">

<div class="brand">
<h1>Alony Blanket Wash</h1>
<p>Premium Blanket Cleaning Service</p>
<div class="badges">Fast • Hygienic • Trusted</div>
</div>

<div class="card">

<label>Your Name</label>
<input id="person" placeholder="Enter your name">

<label>Village Name</label>
<input id="village" placeholder="Enter village">

<label>Colony / Area</label>
<input id="colony" placeholder="Enter colony">

<label>Blanket Quantity</label>

<div class="qtyGrid">

<div class="qtyBox">
<label>King Size (₹300)</label>
<input id="kingQty" type="number" placeholder="0" oninput="calculate()">
</div>

<div class="qtyBox">
<label>Medium Size (₹250)</label>
<input id="mediumQty" type="number" placeholder="0" oninput="calculate()">
</div>

<div class="qtyBox">
<label>Small Blankets (₹150)</label>
<input id="smallQty" type="number" placeholder="0" oninput="calculate()">
</div>

</div>

<div class="priceBox">
<div>Estimated Total</div>
<div class="totalMoney" id="money">₹0</div>
</div>

<button onclick="sendOrder()">Order via WhatsApp</button>

</div>

<div class="footer">Alony Blanket Wash © Premium Service</div>

</div>

<script>

let totalMoney = 0;

function calculate(){

let king = document.getElementById("kingQty").value || 0;
let medium = document.getElementById("mediumQty").value || 0;
let small = document.getElementById("smallQty").value || 0;

king = parseInt(king);
medium = parseInt(medium);
small = parseInt(small);

let total = (king * 300) + (medium * 250) + (small * 150);

totalMoney = total;

document.getElementById("money").innerText = "₹" + total;

}

function sendOrder(){

let name = document.getElementById("person").value;
let village = document.getElementById("village").value;
let colony = document.getElementById("colony").value;

let king = document.getElementById("kingQty").value || 0;
let medium = document.getElementById("mediumQty").value || 0;
let small = document.getElementById("smallQty").value || 0;

if(name=="" || village=="" || colony==""){
alert("Please fill your details");
return;
}

let message = "*Alony Blanket Wash Order*%0A%0A";

message += "Name: " + name + "%0A";
message += "Village: " + village + "%0A";
message += "Colony: " + colony + "%0A";

if(king > 0){
message += "King Size: " + king + "%0A";
}

if(medium > 0){
message += "Medium Size: " + medium + "%0A";
}

if(small > 0){
message += "Small Blankets: " + small + "%0A";
}

message += "Total Price: ₹" + totalMoney;

let phone = "918729873353";

let url = "https://wa.me/" + phone + "?text=" + message;

window.open(url,"_blank");

}

</script>

</body>
</html>
